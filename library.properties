sentence=Safe, non-blocking relay control: active-LOW or active-HIGH, no click at boot, interlocks, minimum on/off times and timed pulses.
paragraph=Interlock groups keep motor forward/reverse or fan speed relays from ever being on together, with an optional dead time. Minimum on/off times protect compressors and pumps from short-cycling. onFor() gives timed pulses without delay(). No dynamic memory, timers or interrupts, so it runs on any board.
